# Defaults are editing preferences, not model evidence.
schema_version: '1.3'
preset_version: context-draft-v1
unknown_policy: maintain_state
# Optional generic controls. No progress-dependent parameter changes by default.
progress_curve: []
allow_inferred_controls: false
# 宽松模式：无法确定边界的锚点回退到字幕起点、scope 不确定按当前章节、ambiguous 不再拦截已输出的事件、
# 初始暂停后的首个相对变化视为隐含 start。所有回退都会在 review_reasons 中标记。
lenient_gating: true
rhythm_anchors_ms: {}
initial_state:
  pace_tier: unknown
  amplitude_tier: unknown
  motion_style: unknown
  paused: true
action_defaults:
  pace_tier: medium
  amplitude_tier: small
  motion_style: rhythmic
  paused: false
presets:
  slow_small:
    low: 40
    high: 60
    period_ms: 2000
  medium_small:
    low: 40
    high: 60
    period_ms: 1200
  fast_small:
    low: 40
    high: 60
    period_ms: 700
  slow_medium:
    low: 30
    high: 70
    period_ms: 2000
  slow_large:
    low: 20
    high: 80
    period_ms: 2000
  medium_medium:
    low: 30
    high: 70
    period_ms: 1200
  medium_large:
    low: 20
    high: 80
    period_ms: 1200
  fast_medium:
    low: 30
    high: 70
    period_ms: 700
  fast_large:
    low: 20
    high: 80
    period_ms: 700
tier_map:
  slow/small/rhythmic: slow_small
  medium/small/rhythmic: medium_small
  fast/small/rhythmic: fast_small
  slow/medium/rhythmic: slow_medium
  slow/large/rhythmic: slow_large
  medium/medium/rhythmic: medium_medium
  medium/large/rhythmic: medium_large
  fast/medium/rhythmic: fast_medium
  fast/large/rhythmic: fast_large
